name: linux

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: |
            models
            samples
          key: models-linux-${{ hashFiles('scripts/download-models.sh') }}
      - name: Install deps and download models
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0 libevdev2 libportaudio2 xclip xdotool xvfb xauth
          uv sync
          ./scripts/download-models.sh --samples
      - name: Tests
        run: xvfb-run -a uv run pytest -q -rs
      - name: lipflow doctor (no camera on CI, so this only prints)
        continue-on-error: true
        run: xvfb-run -a uv run lipflow doctor
      - name: Lip-read a sample video end to end
        run: xvfb-run -a uv run lipflow file samples/2016-03-12.mov --start 20.4 --end 28.1 --cleanup basic

name: macos

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]  # Apple Silicon, Intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: |
            models
            samples
          key: models-macos-${{ hashFiles('scripts/download-models.sh') }}
      - name: Install deps and download models
        run: |
          uv sync
          ./scripts/download-models.sh --samples
      - name: Tests
        run: uv run pytest -q -rs
      - name: lipflow doctor (no camera on CI, so this only prints)
        run: uv run lipflow doctor; exit 0
      - name: Lip-read a sample video end to end
        run: uv run lipflow file samples/2016-03-12.mov --start 20.4 --end 28.1 --cleanup basic
      - name: Build the app bundle (launcher compiled for this Mac's architecture)
        run: |
          uv run python scripts/make_app.py --dest "$RUNNER_TEMP"
          file "$RUNNER_TEMP/Lipflow.app/Contents/MacOS/"*
